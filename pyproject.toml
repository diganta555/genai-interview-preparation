[project]
name = "genai-interview-preparation"
version = "0.1.0"
description = "Practical written GenAI learning and interview reference"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
frameworks = ["langchain>=1,<2", "langchain-core>=1,<2", "langgraph>=1,<2", "langchain-text-splitters>=1,<2"]
vectors = ["chromadb>=1,<2", "qdrant-client>=1.12,<2", "faiss-cpu>=1.9,<2"]
embeddings = ["sentence-transformers>=3,<6"]
aws = ["boto3>=1.34,<2"]
llamaindex = ["llama-index-core>=0.12,<1", "llama-index-llms-ollama>=0.5,<1", "llama-index-embeddings-huggingface>=0.5,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
package = false
