<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenAI Learning Lab</title><style>body{font:18px system-ui;max-width:780px;margin:50px auto;padding:20px;background:#f5f7fa;color:#17233c}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit}pre{white-space:pre-wrap;background:white;padding:20px}label{display:block;margin-top:20px}</style>
<h1>Knowledge Lab</h1><p>Try the synthetic refund and delivery policies. This local lab uses lexical search and extracts evidence. It does not call an LLM.</p>
<form id="form"><label for="key">Local development API key</label><input id="key" type="password" required autocomplete="off"><label for="question">Question</label><textarea id="question" required>refund receipt</textarea><button>Ask</button></form><pre id="result" aria-live="polite"></pre>
<script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#result');out.textContent='Loading…';try{const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.querySelector('#key').value},body:JSON.stringify({question:document.querySelector('#question').value})});const data=await r.json();out.textContent=JSON.stringify(data,null,2);}catch(e){out.textContent='Request failed. Check that the local API is running.'}});</script></html>
